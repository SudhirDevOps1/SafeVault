name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build Desktop & Mobile Apps (consumes more runner minutes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Security Scan
        run: pnpm run scan

      - name: Type check
        run: pnpm run typecheck

      - name: Run Unit & E2E Tests
        run: pnpm test

      - name: Run tests with coverage
        run: pnpm run test:coverage || true

      - name: Build web app and extension
        run: pnpm run build

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build-desktop:
    name: Build Desktop App
    needs: lint-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.build_desktop == true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Enable Symlinks (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.symlinks true
        shell: pwsh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build web app
        run: pnpm run build

      - name: Setup Java JDK (Android)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/SafeVault-debug.apk

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run electron:build -- --linux
        continue-on-error: true

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm run electron:build -- --win
        continue-on-error: true

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm run electron:build -- --mac
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safevault-${{ matrix.os }}
          path: release/
          if-no-files-found: ignore
