name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target tag to build and attach assets to (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Evaluate Release PR & Tags
    if: github.repository == 'SudhirDevOps1/SafeVault'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.1.4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Multi-Target Release Artifacts (Web PWA, Chrome Extension, Android APK, Linux Desktop)
  build-and-upload-assets:
    name: Build & Package (Web, Extension, Android, Linux)
    needs: release-please
    if: ${{ github.repository == 'SudhirDevOps1/SafeVault' && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Fail release if secret or .env files are present
        run: |
          echo "Scanning workspace for sensitive files..."
          SECRETS=$(find . -maxdepth 3 -type f \( -name "*.env*" -o -name "*id_rsa*" -o -name "*.pem" -o -name "*.key" \) ! -path "./node_modules/*" ! -path "./.git/*" || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::Sensitive files detected prior to release build: $SECRETS"
            exit 1
          fi
          echo "Workspace safe for artifact compilation."

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21 (for Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web App & Chrome Extension
        run: pnpm run build

      - name: Build Android APK
        run: |
          pnpm exec cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || echo "Android assembleDebug finished"
          cd ..
        continue-on-error: true

      - name: Build Linux Desktop (AppImage & deb)
        run: pnpm run electron:build -- --linux || echo "Linux electron packaging completed"
        continue-on-error: true

      - name: Package Release Artifacts and Generate SHA-256 Checksums
        run: |
          RAW_TAG="${{ needs.release-please.outputs.tag_name || inputs.target_tag || 'v0.2.0' }}"
          VERSION="${RAW_TAG#v}"
          mkdir -p release-artifacts

          # 1. Package Chrome Extension
          if [ -d "extension" ]; then
            (cd extension && zip -r "../release-artifacts/SafeVault-v${VERSION}-chrome-extension.zip" . -x "*.DS_Store*")
          fi

          # 2. Package Web Production Build
          if [ -d "dist" ]; then
            tar -czf "release-artifacts/SafeVault-v${VERSION}-web-pwa.tar.gz" -C dist .
          fi

          # 3. Collect Android APK if generated
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/SafeVault-v${VERSION}-android.apk"
          fi

          # 4. Collect Electron Linux binaries if generated
          if [ -d "release" ]; then
            cp release/*.AppImage release/*.deb release-artifacts/ 2>/dev/null || true
          fi

          # 5. Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Upload Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name || inputs.target_tag || 'v0.2.0' }}"
          gh release upload "$TAG_NAME" release-artifacts/* --clobber

  # Windows Desktop Installer (.exe): runs in GitHub Actions Windows Cloud Runner
  build-windows-setup:
    name: Build Windows Setup Installer (.exe)
    needs: release-please
    if: ${{ github.repository == 'SudhirDevOps1/SafeVault' && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - name: Enable Symlinks (Windows)
        run: git config --global core.symlinks true
        shell: pwsh

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Build Windows Setup Installer (.exe)
        run: pnpm run electron:build -- --win
        continue-on-error: true

      - name: Upload Windows Setup .exe to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name || inputs.target_tag || 'v0.2.0' }}"
          if (Test-Path "release\*.exe") {
            Get-ChildItem -Path "release" -Filter "*.exe" | ForEach-Object {
              gh release upload $tag $_.FullName --clobber
            }
          }
        shell: pwsh

  # macOS Application (.dmg & .zip): runs in GitHub Actions macOS Cloud Runner
  build-mac:
    name: Build macOS Application (.dmg & .zip)
    needs: release-please
    if: ${{ github.repository == 'SudhirDevOps1/SafeVault' && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Build macOS Application (.dmg & .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run electron:build -- --mac
        continue-on-error: true

      - name: Upload macOS Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name || inputs.target_tag || 'v0.2.0' }}"
          if ls release/*.dmg release/*.zip 1> /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/*.dmg release/*.zip --clobber
          fi
